# static branding assets
location = /brand/brand.css {
	include /usr/share/grommunio-common/nginx/security.conf;
	root /run/grommunio-brand;
	default_type text/css;
	expires -1;
	try_files $uri @brand_none;
}
location = /brand/brand.json {
	include /usr/share/grommunio-common/nginx/security.conf;
	root /run/grommunio-brand;
	expires -1;
	try_files $uri =404;
}
location ^~ /brand/ {
	include /usr/share/grommunio-common/nginx/security.conf;
	root /run/grommunio-brand;
	access_log off;
	expires 7d;
	try_files $uri =404;
}
location @brand_none {
	include /usr/share/grommunio-common/nginx/security.conf;
	default_type text/css;
	return 200 "";
}
