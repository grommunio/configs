upstream gromoxhttp {
	server localhost:10443;

	#
	# Keep idle connections to gromox-http instead of opening a new
	# TLS connection for every proxied request. keepalive is per
	# worker, and idle connections count against gromox-http's
	# context_num. The idle timeout must stay below gromox-http's
	# http_conn_timeout (default 3min).
	#
	keepalive 16;
	keepalive_timeout 60s;
}

#
# Pooled connections are shared between clients, and gromox-http keeps a
# connection that completed Negotiate (SPNEGO/NTLM) authenticated for
# the requests that follow on it. Requests carrying such credentials are
# therefore sent with Connection: close, so their connection is never
# returned to the pool.
#
map $http_authorization $gromox_upstream_connection {
	default "";
	"~*^(negotiate|ntlm)[ \t]" close;
}
